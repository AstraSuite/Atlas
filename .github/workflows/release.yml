name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            git \
            rust \
            qt6-base \
            qt6-declarative \
            qt6-multimedia \
            qt6-svg

      - name: Mark git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Cargo version from git tag
        run: |
          # Tag being released wins over any other reachable tag.
          export ATLAS_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/sync-version.sh

      - name: Build
        run: cargo build --release --locked

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          cp -v target/release/atlas "astra-atlas-${tag}"
          # Package the synced working tree, not the tag's tree: the manifest
          # version is written by sync-version.sh after the tag was created.
          git ls-files -z | tar --null --files-from=- \
            --transform="s|^|astra-atlas-${version}/|" \
            -czf "astra-atlas-${version}.tar.gz"

          echo "ARTIFACTS<<EOF" >> "$GITHUB_ENV"
          echo "astra-atlas-${tag}" >> "$GITHUB_ENV"
          echo "astra-atlas-${version}.tar.gz" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Atlas ${{ github.ref_name }}
          files: ${{ env.ARTIFACTS }}
          generate_release_notes: true
